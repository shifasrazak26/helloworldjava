apiVersion: apps/v1
kind: Deployment

metadata:
  name: javaapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: javaapp

  template:
    metadata:
      labels:
        app: javaapp

    spec:
      containers:
      - name: javaapp
        image: mohammedshifas/javaapp:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8080
