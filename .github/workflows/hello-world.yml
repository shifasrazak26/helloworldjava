name: Deploy WAR to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build WAR
      - name: Build with Maven
        run: mvn clean package

      # 4. Debug build output (IMPORTANT)
      - name: List target folder
        run: ls -la target

      # 5. Copy WAR to EC2 (FIXED)
      - name: Copy WAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.war"
          target: "/home/ec2-user/deploy-temp"
          strip_components: 1

      # 6. Deploy to Tomcat
      - name: Deploy WAR and Restart Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Stopping Tomcat..."
            sudo systemctl stop tomcat10 || true

            echo "Cleaning old deployment..."
            sudo rm -rf /var/lib/tomcat10/webapps/ROOT
            sudo rm -f /var/lib/tomcat10/webapps/ROOT.war

            echo "Checking uploaded files..."
            ls -la /home/ec2-user/deploy-temp

            echo "Deploying WAR..."
            sudo mv /home/ec2-user/deploy-temp/*.war /var/lib/tomcat10/webapps/ROOT.war

            echo "Starting Tomcat..."
            sudo systemctl start tomcat10

            echo "Deployment completed!"

