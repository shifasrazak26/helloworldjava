```yaml
name: Java Docker CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Get the source code
      - name: Checkout source code
        uses: actions/checkout@v4


      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # 3. Build Java application
      - name: Build with Maven
        run: mvn clean package


      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/java-app:latest .


      # 6. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/java-app:latest


      # 7. Connect to EC2 and deploy Docker container
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "================================="
            echo "Starting Docker deployment"
            echo "================================="

            echo "Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/java-app:latest

            echo "Stopping old container..."
            docker stop java-app || true

            echo "Removing old container..."
            docker rm java-app || true

            echo "Starting new container..."
            docker run -d \
              --name java-app \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/java-app:latest

            echo "Checking running containers..."
            docker ps

            echo "Checking application container..."
            docker logs --tail 20 java-app

            echo "================================="
            echo "Deployment completed successfully"
            echo "================================="
```
