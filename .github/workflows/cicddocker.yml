name: Java Docker CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v4


      # 2. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # 3. Build Java application
      - name: Build application with Maven
        run: mvn clean package


      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/java-app:latest .


      # 6. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/java-app:latest


      # 7. Connect to EC2 and deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Pull latest Docker image
            docker pull ${{ secrets.DOCKER_USERNAME }}/java-app:latest

            # Stop old container
            docker stop java-app || true

            # Remove old container
            docker rm java-app || true

            # Start new container
            docker run -d \
              --name java-app \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/java-app:latest
